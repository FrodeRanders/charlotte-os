[package]
name = "charlotte-management-tls"
version = "0.1.0"
edition = "2024"
description = "Freestanding mutually authenticated CharlotteOS management TLS"

[dependencies]
charlotte-launch = { path = "../charlotte-launch" }
rustls = { version = "=0.23.46", default-features = false, features = ["custom-provider"] }
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }
p256 = { version = "0.14", default-features = false, features = ["pkcs8", "ecdsa", "alloc"] }
aes = { version = "0.8.4", default-features = false, features = ["zeroize"] }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "zeroize"] }
ghash = { version = "0.5.1", default-features = false, features = ["zeroize"] }
polyval = { version = "0.6.2", default-features = false, features = ["zeroize"] }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1", default-features = false, features = ["embassy-crypto-sha256", "embassy-crypto-hmac-sha256", "embassy-crypto-p256-ecdh", "embassy-crypto-p256-ecdsa"] }
getrandom = { version = "0.4", features = ["sys_rng"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(polyval_force_soft)'] }
