[package]
name = "charlotte-launch"
version = "0.1.0"
edition = "2024"
description = "Shared fixed-width CharlotteOS userspace launch ABI"

[lib]
name = "charlotte_launch"
path = "src/lib.rs"
test = false
bench = false

[dependencies]
ed25519-compact = { version = "2.3.1", default-features = false }
hpke = { version = "0.14.0", default-features = false, features = ["chacha", "x25519"] }
rand_core = { version = "0.10.0", default-features = false }

[dev-dependencies]
getrandom = { version = "0.4", features = ["sys_rng"] }
