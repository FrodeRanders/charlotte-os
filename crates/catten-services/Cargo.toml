[dependencies]
charlotte-authorization = { path = "../charlotte-authorization" }
catten-rt = { path = "../catten-rt" }
charlotte-launch = { path = "../charlotte-launch" }
charlotte-protocol-net = { path = "../charlotte-protocol-net" }
charlotte-protocol-msg = { path = "../charlotte-protocol-msg" }
charlotte-smoltcp = { path = "../charlotte-smoltcp" }
smoltcp = { version = "0.13", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "proto-ipv6", "proto-dhcpv4", "socket-raw", "socket-udp", "socket-tcp", "socket-dhcpv4"] }
catten-syscall = { path = "../catten-syscall" }
catten-graft = { path = "../catten-graft" }
spin = ">=0.10.0"
charlotte-protocol-block = { path = "../charlotte-protocol-block" }
charlotte-protocol-objstore = { path = "../charlotte-protocol-objstore" }
charlotte-protocol-fs = { path = "../charlotte-protocol-fs" }
charlotte-protocol-kafka = { path = "../charlotte-protocol-kafka" }
charlotte-protocol-disco = { path = "../charlotte-protocol-disco" }
charlotte-protocol-time = { path = "../charlotte-protocol-time" }
charlotte-protocol-s3 = { path = "../charlotte-protocol-s3" }
charlotte-s3 = { path = "../charlotte-s3" }
charlotte-kafka = { path = "../charlotte-kafka" }
charlotte-kafka-step = { path = "../charlotte-kafka-step" }
embedded-io = { version = "0.7", default-features = false }
embedded-tls = { version = "0.19", default-features = false, features = ["alloc", "rustpki", "rsa", "p384", "ed25519"] }
rand_core = { version = "0.6", default-features = false }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
signature = { version = "2.2", default-features = false }

[dev-dependencies]
ed25519-compact = "2.3.1"
getrandom = { version = "0.4", features = ["sys_rng"] }
rand_core_10 = { package = "rand_core", version = "0.10" }

