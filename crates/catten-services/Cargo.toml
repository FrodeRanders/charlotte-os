[package]
name = "catten-services"
version = "0.1.0"
edition = "2024"
description = "Reference EL0 service programs: name service, echo service, client"
autobins = false

[lib]
name = "catten_services"
path = "src/lib.rs"
bench = false

[[bin]]
name = "ns"
path = "src/bin/ns.rs"
test = false
bench = false

