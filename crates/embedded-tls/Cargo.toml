[package]
name = "embedded-tls"
version = "0.19.0"
edition = "2024"
description = "TLS 1.3 client with no_std support and no allocator"
documentation = "https://docs.rs/embedded-tls"
readme = "README.md"
homepage = "https://embassy.dev"
repository = "https://github.com/embassy-rs/embedded-tls"
license = "Apache-2.0"
keywords = ["embedded", "async", "tls", "no_std", "network"]
exclude = [".github", ".cargo"]

[package.metadata.docs.rs]
features = ["rustpki", "ed25519", "p256", "p384"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
embassy-crypto = { version = "0.1.0", git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }
portable-atomic = { version = "1.6.0", default-features = false }
heapless = { version = "0.9", default-features = false }
embedded-io = "0.7"
embedded-io-async = "0.7"
der = { version = "0.8", features = ["derive", "oid", "heapless"] }

# Logging alternatives
log = { version = "0.4", optional = true }

# Charlotte validates this source through the production service interop suite
# and the isolated parser controls. Upstream's all-driver test dependencies
# would override the workspace's erasing crypto registrations.
[lib]
test = false
doctest = false

[package.metadata.charlotte-upstream]
revision = "6487c62bb084c33361822022e21836ddfd48388f"

[features]
default = []
std = ["embedded-io/std", "embedded-io-async/std"]
rustpki = []
ed25519 = []
p256 = []
p384 = []

# Source branches for upstream-only configurations remain inactive. Adding one
# to this manifest requires separate backend/advisory/target qualification.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)', 'cfg(feature, values("rsa", "defmt", "webpki", "x25519", "mlkem", "tokio"))'] }
