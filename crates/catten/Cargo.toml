[package]
name = "catten"
version = "0.8.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bin]]
name = "catten"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["acpi", "display"]

acpi = []
devicetree = ["dep:flat_device_tree"]
# If this is disabled all display code will be stripped out to reduce size for headless systems.
display = ["dep:flanterm_bindings"]
yield_trace = []
scheduler_trace = []
virtio_gpu = ["display"]
# Apple HVF cannot emulate MMIO from EL0 or ECAM reads with missing ISS
# syndrome info (hvf_handle_exception: isv assertion). This skips the PCI
# topology probe and the EL0 virtio-net test. Use on macOS with -accel hvf.
hvf_compat = []
# Run the userspace virtio-net integration verifier. Ordinary boots attach a
# NIC and launch network services without this feature; it only adds test
# registration, readiness assertions, and pass/fail reporting.
virtio_net_test = []
# Extend the virtio-net test across a QEMU socket LAN with the reliable
# message service. Requires virtio_net_test and a second guest.
relmsg_net_test = ["virtio_net_test"]
# Run the cluster discovery test (Ethernet broadcast bootstrap). Requires
# virtio_net_test. For cross-node testing, also set disco_cross_node_test.
disco_net_test = ["virtio_net_test"]
# Extend the disco test to wait for cross-node peer discovery.
disco_cross_node_test = ["disco_net_test"]
# Run the distributed name service test: a Raft group over the network whose
# catalog replicates name registrations across the cluster.
dns_net_test = ["disco_net_test"]
# Run the cluster-deployment phase of the dns test: the leader deploys a
# signed artifact to the peer node, the remote agent picks it up and serves
# it across the network, and the artifact migrates between nodes.
deploy_net_test = ["dns_net_test"]
# Run the clusterctl administration test: upload/deploy/status through the
# cluster administration service, plus the serial admin console.
clusterctl_test = ["deploy_net_test"]
# Run the TCP/IP test: the smoltcp userspace adapter served through the
# frouter, exchanging TCP data between two guests on a QEMU stream LAN.
tcpip_net_test = ["virtio_net_test"]
# Run the HTTP keyhole test: a hardcoded HTTP server on port 80 serving
# observable node state over the tcpip service, reachable from the host via
# SLIRP hostfwd (single guest, user network).
http_net_test = ["virtio_net_test"]
# Run the single-node DHCP smoke test: spawn tcpip in DHCP mode and verify it
# acquires a non-zero interface address from the network's DHCP server. Unlike
# the cross-node tcpip_net_test this runs in a single guest (QEMU SLIRP or
# VMware NAT) and only exercises the lease-acquisition path.
dhcp_test = ["virtio_net_test"]
# Start an ephemeral, TLS-enabled S3 profile and run a complete object
# round-trip against the run script's Docker RustFS fixture.
s3_test = ["dhcp_test"]
# Start an ephemeral Kafka KRaft profile and validate idempotent production,
# read-committed consumption, abort filtering, and transactional offset commit.
kafka_test = ["dhcp_test"]
# Exercise group and transaction coordinator movement in the Kafka fixture.
kafka_coordinator_test = ["kafka_test"]
# Fence one connector by launching a second producer with the same
# transactional identity and require the first connector to fail closed.
kafka_fencing_test = ["kafka_test"]
# Run only the EL0 service lifecycle/live-upgrade deferred integration test.
# Synchronous kernel subsystem tests still run.
live_upgrade_test = []
# Run the x86_64 EL0 smoke test: loads a real Rust ELF (the `smoke` service)
# into ring 3. Requires CATTEN_X86_64_SMOKE_ELF to point at the signed ELF.
x86_el0_smoke = []
qemu = ["virtio_gpu"]

[dependencies]
catten-syscall = { path = "../catten-syscall" }
charlotte-lifecycle = { path = "../charlotte-lifecycle" }
charlotte-launch = { path = "../charlotte-launch" }
charlotte-protocol-disco = { path = "../charlotte-protocol-disco" }
charlotte-protocol-kafka = { path = "../charlotte-protocol-kafka" }
charlotte-kafka-step = { path = "../charlotte-kafka-step" }
charlotte-protocol-s3 = { path = "../charlotte-protocol-s3" }
# Keep the protocol bindings aligned with the vendored, boot-tested Limine
# loader. 0.x releases are not API-compatible with one another, so a lower
# bound would allow an unreviewed protocol/API migration on `cargo update`.
limine = { version = "=0.6.5" }
lock_api = { version = ">=0.4.14", features = ["nightly"] }
concurrent-queue = { version = "2.5.0", default-features = false }
hashbrown = { version = ">=0.16.0", features = ["nightly"] }
spin = { version = ">=0.10.0", features = ["lock_api"] }
talc = { version = ">=5.0.3", features = ["nightly", "counters"] }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
flanterm_bindings = { version = ">=1.0.0", optional = true }
flat_device_tree = { version = "3.1.1", optional = true }
