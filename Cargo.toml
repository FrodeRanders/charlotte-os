[workspace]
members = ["crates/*", "tools/cluster-sign"]
# EL0 bundles and host tools need different targets and build workflows. Keep
# them as workspace members so repository-wide tooling (notably rustfmt) sees
# every package, but do not include them in an unqualified root build.
default-members = [
    "crates/catten",
    "crates/catten-graft",
    "crates/catten-rt",
    "crates/catten-syscall",
    "crates/charlotte-authorization",
    "crates/charlotte-kafka",
    "crates/charlotte-kafka-step",
    "crates/charlotte-launch",
    "crates/charlotte-lifecycle",
    "crates/charlotte-protocol-block",
    "crates/charlotte-protocol-disco",
    "crates/charlotte-protocol-fs",
    "crates/charlotte-protocol-kafka",
    "crates/charlotte-protocol-msg",
    "crates/charlotte-protocol-net",
    "crates/charlotte-protocol-objstore",
    "crates/charlotte-protocol-s3",
    "crates/charlotte-protocol-time",
    "crates/charlotte-s3",
    "crates/charlotte-smoltcp",
]
resolver = "3"

[profile.dev]
debug = "full"
debug-assertions = true
panic = "abort"
lto = true
opt-level = 3

# ed25519-compact's windowed-scalar slide relies on wrapping i8 arithmetic;
# with debug overflow checks its verifier can panic on valid inputs. The
# crypto math is deliberately wrapping; keep checks everywhere else.
[profile.dev.package.ed25519-compact]
overflow-checks = false

[profile.dev.package.catten-services]
opt-level = "s"

[profile.dev.package.catten-user]
opt-level = "s"

[profile.release]
debug = "none"
debug-assertions = false
panic = "abort"
lto = true
opt-level = 3

[profile.release.package.catten-services]
opt-level = "s"

[profile.release.package.catten-user]
opt-level = "s"
