[workspace]
members = ["crates/*", "tools/cluster-sign", "tests/transport"]
# EL0 bundles and host tools need different targets and build workflows. Keep
# them as workspace members so repository-wide tooling (notably rustfmt) sees
# every package, but do not include them in an unqualified root build.
default-members = [
    "crates/catten",
    "crates/knytos-graft",
    "crates/knytos-rt",
    "crates/knytos-app",
    "crates/knytos-app-sitas",
    "crates/knytos-protocol-grant",
    "crates/knytos-syscall",
    "crates/knytos-authorization",
    "crates/knytos-kafka",
    "crates/knytos-kafka-step",
    "crates/knytos-launch",
    "crates/knytos-lifecycle",
    "crates/knytos-protocol-block",
    "crates/knytos-protocol-disco",
    "crates/knytos-protocol-dns",
    "crates/knytos-protocol-ns",
    "crates/knytos-protocol-fs",
    "crates/knytos-protocol-kafka",
    "crates/knytos-protocol-msg",
    "crates/knytos-protocol-net",
    "crates/knytos-protocol-objstore",
    "crates/knytos-protocol-s3",
    "crates/knytos-protocol-time",
    "crates/knytos-s3",
    "crates/knytos-smoltcp",
]
resolver = "3"

[profile.dev]
debug = "full"
debug-assertions = true
panic = "abort"
lto = true
opt-level = 3

# ed25519-compact's windowed-scalar slide relies on wrapping i8 arithmetic;
# with debug overflow checks its verifier can panic on valid inputs. The
# crypto math is deliberately wrapping; keep checks everywhere else.
[profile.dev.package.ed25519-compact]
overflow-checks = false

[profile.dev.package.knytos-services]
opt-level = "s"

[profile.dev.package.knytos-user]
opt-level = "s"

[profile.release]
debug = "none"
debug-assertions = false
panic = "abort"
lto = true
opt-level = 3

[profile.release.package.knytos-services]
opt-level = "s"

[profile.release.package.knytos-user]
opt-level = "s"
