[workspace]
members = ["crates/*"]
# catten-user is a no_std/no_main EL0 test program built for its own custom
# target, and it currently depends on the in-progress ../../gautelis/sitas
# crates which do not yet build. Exclude it from the workspace so root-level
# `cargo build`/`check` and rust-analyzer do not attempt it. Build it directly
# with `--manifest-path crates/catten-user/Cargo.toml` once sitas compiles.
exclude = ["crates/catten-user", "crates/catten-services"]
resolver = "3"

[profile.dev]
debug = "full"
debug-assertions = true
panic = "abort"
lto = true
opt-level = 3

# ed25519-compact's windowed-scalar slide relies on wrapping i8 arithmetic;
# with debug overflow checks its verifier can panic on valid inputs. The
# crypto math is deliberately wrapping; keep checks everywhere else.
[profile.dev.package.ed25519-compact]
overflow-checks = false

[profile.release]
debug = "none"
debug-assertions = false
panic = "abort"
lto = true
opt-level = 3
