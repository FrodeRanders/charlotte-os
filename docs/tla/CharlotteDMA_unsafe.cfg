\* Negative regression configuration. Exclusive DMA without first excluding
\* CPU access must violate ExclusiveDmaHasNoCpuAuthority.
SPECIFICATION UnsafeSpec

CONSTANTS
    Driver     = {driver1}
    Stream     = {stream1}
    Memory     = {memory1}
    Domain     = {domain1}
    NullDriver = noDriver
    NullStream = noStream

INVARIANT ExclusiveDmaHasNoCpuAuthority

CHECK_DEADLOCK FALSE
