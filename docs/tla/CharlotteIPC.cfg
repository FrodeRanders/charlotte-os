\* TLC model-checking configuration for CharlotteIPC.tla
\*
\* Usage: java -cp tla2tools.jar tlc2.TLC CharlotteIPC -config CharlotteIPC.cfg
\*
\* Larger state-space configuration. Unlike `CharlotteIPC_small.cfg` (which the
\* model runner uses), this configuration did not exhaust in a 15-minute TLC
\* budget on current hardware.

SPECIFICATION Spec

CONSTANTS
    ASID       = {a1, a2}
    MaxCaps    = 12
    MaxEps     = 2
    MaxTokens  = 6
    MaxCalls   = 6
    MaxMems    = 4
    MaxQueue   = 2
    NullAsid   = a0

INVARIANT Invariants

\* Disable deadlock checking since the system is reactive (always has Next enabled
\* via EndpointCreate etc. until resources are exhausted).
CHECK_DEADLOCK FALSE
