\* Negative regression configuration. The old cross-LP abort transition must
\* violate ReapOnlyOffCpu; docs/tla/check.sh treats that counterexample as pass.
SPECIFICATION UnsafeSpec

CONSTANTS
    Threads       = {t1}
    LPs           = {lp1, lp2}
    ASID          = {a1}
    MaxGeneration = 2
    NullAsid      = a0
    NullLp        = lp0

INVARIANT ReapOnlyOffCpu

CHECK_DEADLOCK FALSE
