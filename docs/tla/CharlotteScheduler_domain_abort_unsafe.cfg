\* Negative regression configuration. Publishing a new sibling after the
\* domain-abort snapshot must violate AbortingThreadsDoomed.
SPECIFICATION UnsafeDomainSpec

CONSTANTS
    Threads       = {t1, t2}
    LPs           = {lp1, lp2}
    ASID          = {a1}
    MaxGeneration = 2
    NullAsid      = a0
    NullLp        = lp0

INVARIANT AbortingThreadsDoomed

CHECK_DEADLOCK FALSE
