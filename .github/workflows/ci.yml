name: CI

on:
  push:
    branches: [dev, main, async-syscall-abi, shard-local-kernel]
  pull_request:
    branches: [dev, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  formatting:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-27
          components: rustfmt

      - name: Check workspace and standalone EL0 crates
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path crates/catten-services/Cargo.toml -- --check
          cargo fmt --manifest-path crates/catten-user/Cargo.toml -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-27
          targets: aarch64-unknown-none
          components: clippy,rust-src,llvm-tools

      - name: Lint workspace
        run: |
          SITAS_DIR="$(cd "$GITHUB_WORKSPACE/crates/catten-user/../../../.." && pwd)/gautelis/sitas"
          git clone https://github.com/FrodeRanders/sitas.git "$SITAS_DIR"
          git -C "$SITAS_DIR" checkout dc80461703eee8495697ad022f0b77c33fde42db
          scripts/build-catten-services.sh --embed
          scripts/build-catten-user.sh --embed
          export CATTEN_AARCH64_SERVICE_BUNDLE="$GITHUB_WORKSPACE/target/embedded-services/aarch64-unknown-none"
          cargo clippy --workspace \
            --target target_specs/aarch64-unknown-none-catten.json \
            -- -D warnings

  host-tests:
    name: Host-test libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-27

      - name: Run host-testable library suites
        run: |
          set -euo pipefail
          cd /tmp
          for manifest in \
            crates/charlotte-protocol-msg/Cargo.toml \
            crates/catten-graft/Cargo.toml \
            crates/charlotte-smoltcp/Cargo.toml
          do
            cargo test --manifest-path "$GITHUB_WORKSPACE/$manifest"
          done

  el0-build:
    name: Build warning-clean EL0 services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-27
          targets: aarch64-unknown-none
          components: rust-src,llvm-tools

      # catten-user integrates the sibling gautelis/sitas checkout and is built
      # by scripts/build-catten-user.sh in developer trees that provide it.
      - name: Build service bundle
        run: scripts/build-catten-services.sh

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-none-catten
          - x86_64-unknown-none-catten
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-27
          targets: ${{ matrix.target == 'aarch64-unknown-none-catten' && 'aarch64-unknown-none' || 'x86_64-unknown-none' }}
          components: rust-src,llvm-tools

      - name: Build kernel
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-none-catten" ]; then
            SITAS_DIR="$(cd "$GITHUB_WORKSPACE/crates/catten-user/../../../.." && pwd)/gautelis/sitas"
            git clone https://github.com/FrodeRanders/sitas.git "$SITAS_DIR"
            git -C "$SITAS_DIR" checkout dc80461703eee8495697ad022f0b77c33fde42db
            scripts/build-catten-services.sh --embed
            scripts/build-catten-user.sh --embed
            export CATTEN_AARCH64_SERVICE_BUNDLE="$GITHUB_WORKSPACE/target/embedded-services/aarch64-unknown-none"
          fi
          cargo build --package catten \
            --target "target_specs/${{ matrix.target }}.json" \
            --no-default-features --features acpi

  test:
    name: Test (${{ matrix.target }})
    # Ubuntu 24.04 ships QEMU 8.2, which cannot request a GICv2m MSI frame
    # alongside GICv3. The macOS ARM image uses current Homebrew QEMU, matching
    # the supported development configuration.
    runs-on: macos-15
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-none-catten
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-27
          targets: aarch64-unknown-none
          components: rust-src,llvm-tools

      - name: Install QEMU
        run: brew install qemu mtools

      - name: Check out sitas userspace dependency
        run: |
          SITAS_DIR="$(cd "$GITHUB_WORKSPACE/crates/catten-user/../../../.." && pwd)/gautelis/sitas"
          git clone https://github.com/FrodeRanders/sitas.git "$SITAS_DIR"
          git -C "$SITAS_DIR" checkout dc80461703eee8495697ad022f0b77c33fde42db

      # Keep CI on the same multicore, MSI-X/NVMe configuration and marker
      # list used by developers. This also rebuilds the embedded EL0 bundle.
      - name: Boot QEMU and verify self-tests
        run: scripts/run-aarch64.sh debug --smp 4 --timeout 180
