[package]
name = "charlotte-transport-tests"
version = "0.1.0"
edition = "2024"
publish = false

# Keep host integration tests above both layers. Testing catten-services as the
# selected package also builds its freestanding service entry points.
[[test]]
name = "receive_erasure"
path = "receive_erasure.rs"

[[test]]
name = "s3_response_erasure"
path = "s3_response_erasure.rs"

[dev-dependencies]
catten-services = { path = "../../crates/catten-services" }
charlotte-kafka = { path = "../../crates/charlotte-kafka" }
charlotte-s3 = { path = "../../crates/charlotte-s3" }
embedded-io = { version = "0.7", default-features = false }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

[[test]]
name = "s3_request_erasure"
path = "s3_request_erasure.rs"
