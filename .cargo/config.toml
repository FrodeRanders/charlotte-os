[unstable]
json-target-spec = true
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

# Kernel panics cannot unwind, so their allocation-free backtrace walks frame
# pointers. Apply this only to the custom kernel targets; userspace services
# retain their existing code-generation settings.
# Target flags override build.rustflags, so retain the denied-warning policy
# here too. CI uses CARGO_BUILD_RUSTFLAGS; global RUSTFLAGS would shadow these.
[target.x86_64-unknown-none-catten]
# Workspace Clippy also compiles management TLS for the kernel target.
# Keep the same erasing POLYVAL backend as the x86 service target below.
rustflags = ["-D", "warnings", "-C", "force-frame-pointers=yes", "--cfg", "polyval_force_soft"]

[target.aarch64-unknown-none-catten]
rustflags = ["-D", "warnings", "-C", "force-frame-pointers=yes"]

# POLYVAL 0.6.2's x86 dispatcher does not drop its active authentication
# state. Freestanding services select the erasing software owner instead.
# tls_client rejects a flag/feature override that loses its destructor.
[target.x86_64-unknown-none]
rustflags = ["-D", "warnings", "--cfg", "polyval_force_soft"]

[env]
# Tell clang/cc and bindgen to use a real clang triple instead of our custom one,
# since clang doesn't know about the 'catten' environment component.
CFLAGS_x86_64-unknown-none-catten = "-ffreestanding -mcmodel=kernel"
BINDGEN_EXTRA_CLANG_ARGS_x86_64-unknown-none-catten = "--target=x86_64-unknown-none-elf -ffreestanding -mcmodel=kernel"
CFLAGS_aarch64-unknown-none-catten = "-ffreestanding"
BINDGEN_EXTRA_CLANG_ARGS_aarch64-unknown-none-catten = "--target=aarch64-unknown-none-elf -ffreestanding"
# One node address plus the bounded launch-policy table of cluster VIPs.
SMOLTCP_IFACE_MAX_ADDR_COUNT = "17"
